[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]

name = "oracle-performance-monitoring"

version = "1.0.0"

description = "Oracle Database Performance Monitoring and SQL Tuning Platform"

requires-python = ">=3.11"

dependencies = [
    "oracledb>=2.5.0",
    "pandas>=2.2.0",
    "streamlit>=1.40.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1"
]


[project.optional-dependencies]

test = [
    "pytest>=8.0.0"
]


[tool.pytest.ini_options]

pythonpath = [
    "."
]

testpaths = [
    "tests"
]

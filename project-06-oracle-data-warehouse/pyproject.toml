[build-system]

requires = [
    "setuptools>=68"
]

build-backend = "setuptools.build_meta"


[project]

name = "oracle-data-warehouse"

version = "1.0.0"

description = "Oracle Data Warehouse and ETL Analytics Platform"

requires-python = ">=3.11"

dependencies = [

    "oracledb>=2.5.0",

    "pandas>=2.2.0",

    "streamlit>=1.40.0",

    "python-dotenv>=1.0.0"

]


[project.optional-dependencies]

test = [
    "pytest>=8.0.0"
]


[tool.pytest.ini_options]

pythonpath = [
    "."
]

testpaths = [
    "tests"
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"


[project]

name = "oracle-ai-rag-chatbot"

version = "1.0.0"

description = "Enterprise RAG chatbot using Python, LangChain, OpenAI and Oracle AI Vector Search"

requires-python = ">=3.11"


[tool.pytest.ini_options]

pythonpath = ["."]
testpaths = ["tests"]

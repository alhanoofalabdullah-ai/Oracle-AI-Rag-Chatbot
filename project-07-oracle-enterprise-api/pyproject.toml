[build-system]

requires = [
    "setuptools>=68"
]

build-backend = "setuptools.build_meta"


[project]

name = "oracle-enterprise-api"

version = "1.0.0"

description = "Enterprise REST API integrated with Oracle Database"

requires-python = ">=3.11"

dependencies = [

    "fastapi>=0.115",

    "uvicorn[standard]>=0.32",

    "oracledb>=2.5",

    "pydantic>=2.9",

    "python-dotenv>=1.0"

]


[project.optional-dependencies]

test = [
    "pytest>=8.0",
    "httpx>=0.27"
]


[tool.pytest.ini_options]

pythonpath = [
    "."
]

testpaths = [
    "tests"
]
